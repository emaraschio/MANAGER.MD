name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and leak scan
        run: python3 scripts/check.py
      - name: Checker tests
        run: python3 -m unittest discover -s tests -v
